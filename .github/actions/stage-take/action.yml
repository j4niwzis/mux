# The build the stage before handed on (stage-give), put back where it was.
name: Take the build from the stage before
inputs:
  name:
    description: The artifact's name (the stage and ABI)
    required: true
runs:
  using: composite
  steps:
    - name: Room for it
      shell: bash
      run: sudo mkdir -p /mnt/stage-take && sudo chown "$USER" /mnt/stage-take
    - uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.name }}-${{ github.sha }}
        path: /mnt/stage-take
    # download-artifact said it went through where the 3 GB archive came
    # cut short ("premature end" at unpacking: the link of 8ebc4d9, on
    # desktop and Android alike). Each archive tested whole; where one is
    # not, fetched again, a few times, before giving up.
    - name: The archives whole
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        whole() { zstd -q -t /mnt/stage-take/work.tar.zst && zstd -q -t /mnt/stage-take/cargo.tar.zst; }
        for attempt in 1 2 3; do
          whole && exit 0
          echo "::warning::the build from the stage before came cut short; fetched again ($attempt)"
          rm -rf /mnt/stage-take/*
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -n "${{ inputs.name }}-${{ github.sha }}" -D /mnt/stage-take || true
        done
        whole
    - name: Unpack the build
      shell: bash
      run: |
        zstd -q -d -c /mnt/stage-take/work.tar.zst | tar -C "$GITHUB_WORKSPACE" -xf -
        zstd -q -d -c /mnt/stage-take/cargo.tar.zst | tar -C "$HOME" -xf -
        sudo rm -rf /mnt/stage-take
