name: android
on:
  # Every commit: the full client, for every ABI. By hand: the one asked for.
  push:
  workflow_dispatch:
    inputs:
      full_client:
        description: Build the experimental full client instead of the bridge check
        type: boolean
        default: false
      abi:
        description: The Android ABI to build for (android/abis.json)
        type: choice
        options: [arm64-v8a, armeabi-v7a]
        default: arm64-v8a

permissions:
  contents: read
  # To drop the caches a run's own supersede (tools/prune_caches.sh).
  actions: write

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm

jobs:
  apk:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.abi) || '["arm64-v8a","armeabi-v7a"]') }}
    timeout-minutes: 360
    # Here, not at the top: the matrix is a job's.
    env:
      ABI: ${{ matrix.abi }}
      # The full client on a push; by hand, as asked.
      FULL: ${{ github.event_name == 'push' && 'client' || inputs.full_client && 'client' || 'bridge' }}
    steps:
      - uses: actions/checkout@v4
      - name: Space and swap for template-heavy compilation
        run: |
          # This workflow builds its own Android toolchain. None of these
          # preinstalled SDKs participates in the D8-free build.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo swapoff -a || true
          sudo rm -f /mnt/mux.swap
          sudo fallocate -l 32G /mnt/mux.swap
          sudo chmod 600 /mnt/mux.swap
          sudo mkswap /mnt/mux.swap
          sudo swapon /mnt/mux.swap
          free -h
          df -h / /mnt
      - name: Host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3 openjdk-17-jdk-headless \
            aapt zipalign dexdump generate-ninja nasm pkg-config perl \
            curl lsb-release software-properties-common gnupg
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          sudo bash /tmp/llvm.sh 23
          sudo apt-get install -y lld-23 llvm-23 libc++-23-dev libc++abi-23-dev
          echo /usr/lib/llvm-23/bin >> "$GITHUB_PATH"
          sudo mkdir -p /lib/share/libc++
          sudo ln -sfn /usr/lib/llvm-23/share/libc++/v1 /lib/share/libc++/v1
          version=4.4.3
          curl -fsSL "https://github.com/Kitware/CMake/releases/download/v${version}/cmake-${version}-linux-x86_64.tar.gz" -o /tmp/cmake.tar.gz
          sudo tar xzf /tmp/cmake.tar.gz -C /opt
          echo "/opt/cmake-${version}-linux-x86_64/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4
        with:
          repository: j4niwzis/minimal-android-ndk.cpp
          ref: 517d2f85f613dc07c71b98bad79e424a46e1a4c3
          path: ndk-tool
      - name: Toolchain manifest for the ABI
        id: abi
        run: |
          python3 tools/android_manifest.py --abi "$ABI" --out android-toolchain.json
          echo "rust=$(python3 tools/android_manifest.py --abi "$ABI" --field rust)" >> "$GITHUB_OUTPUT"
          echo "sysroot-triple=$(python3 tools/android_manifest.py --abi "$ABI" --field sysroot-triple)" >> "$GITHUB_OUTPUT"
      - id: toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/mux-android-${{ env.ABI }}
          key: mux-android-${{ env.ABI }}-clang23-v2-${{ hashFiles('android/toolchain-sources.json', 'android/abis.json', 'ndk-tool/src/**', 'ndk-tool/CMakeLists.txt') }}
      - name: Build toolchain and signer from source
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          cmake -S ndk-tool -B ndk-tool/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-23 \
            -DCMAKE_CXX_FLAGS='-stdlib=libc++ -fno-experimental-new-constant-interpreter'
          cmake --build ndk-tool/build -j4
          ndk-tool/build/minimal-android-ndk \
            --root "$HOME/.cache/mux-android-$ABI" \
            --manifest "$PWD/android-toolchain.json" \
            --clang clang-23 --llvm-bin /usr/lib/llvm-23/bin --jobs 4 \
            build runtimes toolchain-file framework-res apksigner
          # toolchain-file builds the headers/stubs/CRT, but does not depend
          # on the C++ runtimes or compiler-rt. Require the complete sysroot
          # before caching it or attempting the application's CMake probes.
          test -f "$HOME/.cache/mux-android-$ABI/sysroot/usr/lib/libc++.modules.json"
          api=$(python3 -c 'import json; print(json.load(open("android-toolchain.json"))["target"]["api"])')
          for library in libc++.a libc++abi.a libunwind.a; do
            test -f "$HOME/.cache/mux-android-$ABI/sysroot/usr/lib/${{ steps.abi.outputs.sysroot-triple }}/$api/$library"
          done
          # One time for all of it: a toolchain built again the same -- its
          # cache evicted -- must not make every object of the build
          # restored out of date, as its headers' new times did.
          find "$HOME/.cache/mux-android-$ABI" -exec touch -h -d "@1000000000" {} +
      - name: Cache the completed toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/mux-android-${{ env.ABI }}
          key: mux-android-${{ env.ABI }}-clang23-v2-${{ hashFiles('android/toolchain-sources.json', 'android/abis.json', 'ndk-tool/src/**', 'ndk-tool/CMakeLists.txt') }}
      - name: Drop the toolchains this one replaces
        if: steps.toolchain.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh tools/prune_caches.sh "mux-android-$ABI-" "${{ steps.toolchain.outputs.cache-primary-key }}"
      - name: Rust Android target
        if: env.FULL == 'client'
        run: rustup target add ${{ steps.abi.outputs.rust }}

      # As in check.yml, keep both the build and the fetched sources, and
      # save them even if compilation fails. Android and desktop outputs
      # need separate keys; bridge and full-client builds do too.
      - name: Identify the build cache
        id: build-identity
        env:
          PROFILE_HASH: ${{ hashFiles('.github/workflows/android.yml', 'android/toolchain-sources.json', 'android/abis.json') }}
        run: |
          digest=$({
            clang++-23 --version
            rustc -vV
            cargo --version
            cmake --version
            ninja --version
            dpkg-query -W libc++-23-dev libc++abi-23-dev
            git -C ndk-tool rev-parse HEAD
            printf '%s\n' "$PROFILE_HASH"
          } | sha256sum)
          echo "digest=${digest%% *}" >> "$GITHUB_OUTPUT"
      - name: Restore the build and fetched sources
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build-android
            .cache/cpm
            ~/.cargo/registry
            ~/.cargo/git
          # A fresh key lets retries save further progress from a failed build.
          key: build-${{ runner.os }}-android-${{ env.ABI }}-${{ env.FULL }}-${{ steps.build-identity.outputs.digest }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: build-${{ runner.os }}-android-${{ env.ABI }}-${{ env.FULL }}-${{ steps.build-identity.outputs.digest }}-
      - name: File times against the build restored
        run: |
          git ls-files -z | xargs -0 touch -d "@1000000000"
          if [ -f build-android/sources.sha1 ]; then
            git ls-files -z | xargs -0 sha1sum | sort > /tmp/android-sources-now.sha1
            sort build-android/sources.sha1 | comm -13 - /tmp/android-sources-now.sha1 | cut -c43- | while IFS= read -r file; do
              touch "$file"
            done
          else
            git ls-files -z | xargs -0 touch
          fi
      - name: Configure and package
        id: build
        env:
          FULL_CLIENT: ${{ env.FULL == 'client' }}
        run: |
          source=android/smoke
          if [ "$FULL_CLIENT" = true ]; then source=.; fi
          cmake -S "$source" -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/.cache/mux-android-$ABI/cmake/target.cmake" \
            -DCMAKE_BUILD_TYPE=Release -DMUX_PROGRAM_JOBS=1 \
            -DMUX_CLI=OFF -DMUX_TESTS=OFF -DMUX_VIDEO=OFF -DMUX_CALLS=ON \
            -DCME_BUILD_MACHINE_CXX_COMPILER=clang++-23 \
            -DCME_BUILD_MACHINE_CXX_FLAGS='-stdlib=libc++ -fno-experimental-new-constant-interpreter'
          cmake --build build-android --target mux-apk -j4
      - name: What the build was built from
        run: git ls-files -z | xargs -0 sha1sum > build-android/sources.sha1
      - name: Verify package
        run: |
          python3 test/android_apk_test.py
          dexdump -c build-android/apk/classes.dex
          zipalign -c 4 build-android/apk/mux-test-signed.apk
          java -jar "$HOME/.cache/mux-android-$ABI/tools/apksigner.jar" verify --verbose \
            build-android/apk/mux-test-signed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mux-android-${{ env.ABI }}-${{ env.FULL }}-test-signed
          path: build-android/apk/mux-test-signed.apk
          if-no-files-found: error
      # The same APK unsigned, aligned: to be signed with a key of one's own.
      - uses: actions/upload-artifact@v4
        with:
          name: mux-android-${{ env.ABI }}-${{ env.FULL }}-unsigned
          path: build-android/apk/mux-unsigned.apk
          if-no-files-found: error
      - name: No source list where the build failed
        if: always() && steps.build.outcome != 'success'
        run: rm -f build-android/sources.sha1
      - name: Keep the build and fetched sources for the next run
        if: always() && steps.build-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            build-android
            .cache/cpm
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Drop the builds this one supersedes
        if: always() && steps.build-cache.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh tools/prune_caches.sh "build-${{ runner.os }}-android-$ABI-$FULL-" "${{ steps.build-cache.outputs.cache-primary-key }}"
