name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every commit gets a run of its own, and a newer push never cancels one
# that is under way: each commit is checked to the end.
concurrency:
  group: check-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  # To drop the caches a run's own supersede (tools/prune_caches.sh).
  actions: write

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm
  # clang 23 is the only one installed: its crashes print named frames.
  LLVM_SYMBOLIZER_PATH: /usr/lib/llvm-23/bin/llvm-symbolizer

jobs:
  clang:
    name: clang ${{ matrix.llvm }}, libc++
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        llvm: [23]
    steps:
      # The whole history, so that each file's time can be the time of the
      # commit that last changed it (below).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The build directory and the fetched sources kept between runs:
      # restored here, and saved at the end whether the build went through or
      # not (below) -- actions/cache saves only after a job that passed, and
      # a run that failed at its link left the next one an older build to
      # start from, ffmpeg cloned again and all of libav built again.
      - uses: actions/cache/restore@v4
        with:
          path: |
            build
            .cache/cpm
          key: build-${{ runner.os }}-clang${{ matrix.llvm }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-clang${{ matrix.llvm }}-

      # ninja decides what to rebuild from the times of files, and a checkout
      # stamps every file with now. The build restored says what it was built
      # from -- each file's hash, written after a build that went through --
      # and a file is new where its hash differs from that, old where not.
      # (The times of the last commits were not enough: runs end in any
      # order, and a build saved later than a change could pass it over.)
      - name: file times against the build restored
        run: |
          git ls-files -z | xargs -0 touch -d "@1000000000"
          if [ -f build/sources.sha1 ]; then
            git ls-files -z | xargs -0 sha1sum | sort > /tmp/sources-now.sha1
            sort build/sources.sha1 | comm -13 - /tmp/sources-now.sha1 | cut -c43- | while IFS= read -r file; do
              touch "$file"
            done
          else
            git ls-files -z | xargs -0 touch
          fi

      # Clang and libc++, which is where `import std` comes from.
      - name: clang and libc++
        run: |
          sudo apt-get update || true
          sudo apt-get install -y ninja-build lsb-release software-properties-common gnupg curl
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh ${{ matrix.llvm }}
          sudo apt-get install -y libc++-${{ matrix.llvm }}-dev libc++abi-${{ matrix.llvm }}-dev

      # OpenSSL is built from its port (perl runs its build; the runner has
      # it). SDL is a window library and needs the headers of the windowing
      # systems it opens windows on.
      # Skia is a GN project: cmake-everywhere runs gn to read it.
      - name: gn
        run: |
          curl -sSL -o gn.zip "https://chrome-infra-packages.appspot.com/dl/gn/gn/linux-amd64/+/latest"
          mkdir -p "$HOME/.local/bin" && unzip -o -j gn.zip gn -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/gn" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: windowing headers
        run: sudo apt-get install -y xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols nasm

      - name: cmake
        run: |
          version=4.4.3
          curl -sSL -o cmake.tar.gz \
            "https://github.com/Kitware/CMake/releases/download/v${version}/cmake-${version}-linux-x86_64.tar.gz"
          sudo tar xzf cmake.tar.gz -C /opt
          echo "/opt/cmake-${version}-linux-x86_64/bin" >> "$GITHUB_PATH"

      # CMake works out where the std module's source is from where the
      # compiler is, and the compiler a distribution installs is a link in a
      # directory that says nothing about its toolchain: the answer is
      # /lib/share/libc++/v1, which no package fills. So both ends are said
      # outright.
      - name: where import std is read from
        run: |
          sudo mkdir -p /lib/share/libc++
          sudo ln -sfn /usr/lib/llvm-${{ matrix.llvm }}/share/libc++/v1 /lib/share/libc++/v1
          sudo ln -sf /usr/lib/llvm-${{ matrix.llvm }}/bin/clang++ /usr/local/bin/clang++
          test -f /lib/share/libc++/v1/std.cppm

      # Template-heavy units need room beyond the runner's physical memory.
      # These preinstalled SDKs are unused by this build; removing them leaves
      # space for both the compiler output and 32 GiB of swap.
      - name: swap
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo swapoff -a || true
          sudo rm -f /mnt/mux.swap
          sudo fallocate -l 32G /mnt/mux.swap
          sudo chmod 600 /mnt/mux.swap
          sudo mkswap /mnt/mux.swap
          sudo swapon /mnt/mux.swap
          free -h

      - name: build
        id: build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMUX_PROGRAM_JOBS=1 \
            -DCMAKE_CXX_COMPILER=/usr/local/bin/clang++ \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
            -DMUX_UI=ON -DMUX_CALLS=ON


          # Every unit that fails, not only the first: a run shows them all.
          cmake --build build -- -k 0

      # What this build was built from, for the next run to compare with:
      # only where it went through, so that what failed is built again.
      - name: what the build was built from
        run: git ls-files -z | xargs -0 sha1sum > build/sources.sha1

      - name: test
        run: ctest --test-dir build --output-on-failure

      # A build that failed may have left what it made from other sources than
      # the list says: the list goes, and the next run builds mux afresh.
      - name: no list where the build failed
        if: failure() && steps.build.outcome == 'failure'
        run: rm -f build/sources.sha1

      # Where the build stopped over the std module: the flags and defines
      # each copy of std, and each copy of a module, was built with -- the
      # difference between them is the answer.
      - name: the std module's copies, where the build failed
        if: failure()
        run: |
          python3 - <<'EOF'
          import re
          text = open("build/build.ninja").read()
          for block in re.split(r"\n(?=build )", text):
              first = block.split("\n", 1)[0]
              if re.search(r"@cmake_cxx_std[^ ]*/std\.cppm|@cmake_cxx_std@synth_\d+\.dir/[0-9a-f]+\.bmi|loom_events(@synth_\d+)?\.dir/src/events\.cc|mux_http(@synth_\d+)?\.dir|knot(@synth_\d+)?\.dir/src/knot\.cc", first):
                  flags = [l.strip() for l in block.split("\n") if l.strip().startswith(("FLAGS", "DEFINES"))]
                  print(first[:160])
                  for f in flags:
                      print("   ", f[:400])
          EOF

      # What was built kept for the next run, the build gone through or not:
      # what failed is built again from it, the rest is not.
      - name: keep the build for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            build
            .cache/cpm
          key: build-${{ runner.os }}-clang${{ matrix.llvm }}-${{ github.sha }}
      - name: drop the builds this one supersedes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh tools/prune_caches.sh "build-${{ runner.os }}-clang${{ matrix.llvm }}-" "build-${{ runner.os }}-clang${{ matrix.llvm }}-${{ github.sha }}"
