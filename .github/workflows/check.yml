name: check

on:
  push:
    branches: [main, testing]
  pull_request:
  workflow_dispatch:

# Every commit gets a run of its own, and a newer push never cancels one
# that is under way: each commit is checked to the end.
concurrency:
  group: check-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  # To drop the caches a run's own supersede (tools/prune_caches.sh).
  actions: write

env:
  # Apply the limit to dependencies and nested CMake builds as well as mux.
  CMAKE_BUILD_PARALLEL_LEVEL: 1
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm
  # clang 23 is the only one installed: its crashes print named frames.
  LLVM_SYMBOLIZER_PATH: /usr/lib/llvm-23/bin/llvm-symbolizer
  # This run's stages' builds, each kept for the next.
  STAGE: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

# The build in stages, a job each, and every other target -- each test, the
# terminal client -- a job of its own: no job near GitHub's six hours. Each
# stage builds its part on the build directory the one before it left in the
# cache.
jobs:
  # Configured, and the libraries every target builds on: the modules.
  modules:
    name: modules (clang ${{ matrix.llvm }})
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      tests: ${{ steps.tests.outputs.list }}
    strategy:
      fail-fast: false
      matrix:
        llvm: [23]
    steps:
      # The whole history, as the first run of this workflow checked out.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/desktop-setup
        with:
          llvm: ${{ matrix.llvm }}
      # The build and the fetched sources the last run kept.
      - uses: actions/cache/restore@v4
        with:
          path: |
            build
            .cache/cpm
          key: build-${{ runner.os }}-clang${{ matrix.llvm }}-${{ env.COMPILER_BUILD }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-clang${{ matrix.llvm }}-${{ env.COMPILER_BUILD }}-
      # ninja goes by file times. A source changed since the build restored
      # was made -- its hash other than the list the build keeps, written
      # after a build that went through -- gets the time this run began; the
      # rest, an old one. What changed is kept with the build: every later
      # stage stamps the same files the same way, so a unit an earlier run
      # built from an older source is built again there too, and one an
      # earlier stage of this run built is not.
      - name: file times against the build restored
        run: |
          mkdir -p build
          began=$(date +%s)
          git ls-files -z | xargs -0 touch -d "@1000000000"
          if [ -f build/sources.sha1 ]; then
            git ls-files -z | xargs -0 sha1sum | sort > /tmp/sources-now.sha1
            sort build/sources.sha1 | comm -13 - /tmp/sources-now.sha1 | cut -c43- > build/changed-sources
          else
            git ls-files > build/changed-sources
          fi
          echo "$began" > build/run-began
          tr '\n' '\0' < build/changed-sources | xargs -0 -r touch -d "@$began"
      - name: configure
        run: |
          export CC=/usr/lib/llvm-${{ matrix.llvm }}/bin/clang
          # CMake resets its cache when the C compiler changes, losing the
          # command-line options (including libc++). Reset only configuration
          # metadata first, keeping objects and fetched sources for reuse.
          python3 - <<'EOF'
          import os, pathlib, re, shutil
          cache = pathlib.Path("build/CMakeCache.txt")
          if cache.exists():
              match = re.search(r"^CMAKE_C_COMPILER:[^=]+=(.*)$", cache.read_text(), re.M)
              if not match or os.path.realpath(match[1]) != os.path.realpath(os.environ["CC"]):
                  cache.unlink()
                  for path in pathlib.Path("build/CMakeFiles").glob("[0-9]*"):
                      if path.is_dir() and re.fullmatch(r"\d+\.\d+.*", path.name):
                          shutil.rmtree(path)
                  print("C compiler changed: reset configuration metadata; retained build outputs")
          EOF
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS_DEBUG='-O3 -g -fno-omit-frame-pointer' -DCMAKE_C_FLAGS_DEBUG='-O3 -g -fno-omit-frame-pointer' -DMUX_PROGRAM_JOBS=1 \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER=/usr/local/bin/clang++ \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
            -DMUX_UI=ON -DMUX_CALLS=ON
      # The tests, each with the target that runs it: a job each.
      - name: the tests
        id: tests
        run: |
          ctest --test-dir build --show-only=json-v1 > /tmp/tests.json
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json, os, sys
          tests = json.load(open("/tmp/tests.json"))["tests"]
          # A test ctest has no command for in this configuration (none is
          # given in its JSON) is nothing a job could run: said, and left out.
          for t in tests:
              if not t.get("command"):
                  print(f"no command, not run: {t['name']}", file=sys.stderr)
          out = [{"name": t["name"], "target": os.path.basename(t["command"][0]) if t["command"][0].startswith(os.path.abspath("build")) else ""}
                 for t in tests if t.get("command")]
          print("list=" + json.dumps(out))
          EOF
      # Every unit that fails, not only the first: a run shows them all.
      - name: build the modules
        id: build
        run: cmake --build build --parallel 1 --target mux_modules -- -k 0
      # Where the build stopped over the std module: the flags and defines
      # each copy of std, and each copy of a module, was built with -- the
      # difference between them is the answer.
      - name: the std module's copies, where the build failed
        if: failure()
        run: |
          python3 - <<'EOF'
          import re
          text = open("build/build.ninja").read()
          for block in re.split(r"\n(?=build )", text):
              first = block.split("\n", 1)[0]
              if re.search(r"@cmake_cxx_std[^ ]*/std\.cppm|@cmake_cxx_std@synth_\d+\.dir/[0-9a-f]+\.bmi|loom_events(@synth_\d+)?\.dir/src/events\.cc|mux_http(@synth_\d+)?\.dir|knot(@synth_\d+)?\.dir/src/knot\.cc", first):
                  flags = [l.strip() for l in block.split("\n") if l.strip().startswith(("FLAGS", "DEFINES"))]
                  print(first[:160])
                  for f in flags:
                      print("   ", f[:400])
          EOF
      # What this build was built from: only where it went through, so
      # that what failed is built again from scratch by the next run.
      - name: what the build was built from
        if: steps.build.outcome == 'success'
        run: git ls-files -z | xargs -0 sha1sum > build/sources.sha1
      - name: no list where the build failed
        if: always() && steps.build.outcome != 'success'
        run: rm -f build/sources.sha1
      # Handed to the next stages of this run, where it went through.
      - name: hand the build on
        if: success()
        uses: ./.github/actions/stage-give
        with:
          name: build-clang${{ matrix.llvm }}-modules
          dir: build
      # Where it failed, kept for the next run to go on from: the cache holds
      # only this and each run's last stage, not a build per stage.
      - name: keep the build where it failed
        if: always() && (steps.build.outcome == 'failure' || steps.build.outcome == 'cancelled')
        uses: actions/cache/save@v4
        with:
          path: |
            build
            .cache/cpm
          key: build-${{ runner.os }}-clang${{ matrix.llvm }}-${{ env.COMPILER_BUILD }}-${{ env.STAGE }}-modules

  # The app's units -- the window's binding among them, hours alone.
  app:
    needs: modules
    name: app (clang ${{ matrix.llvm }})
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        llvm: [23]
    steps:
      # The whole history, as the first run of this workflow checked out.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/desktop-setup
        with:
          llvm: ${{ matrix.llvm }}
      - name: the build the stage before left
        uses: ./.github/actions/stage-take
        with:
          name: build-clang${{ matrix.llvm }}-modules
      # The file times the first stage gave: what changed since the run
      # before, at the time this run began; the rest, old.
      - name: file times as the first stage gave them
        run: |
          git ls-files -z | xargs -0 touch -d "@1000000000"
          tr '\n' '\0' < build/changed-sources | xargs -0 -r touch -d "@$(cat build/run-began)"
      # Every unit that fails, not only the first: a run shows them all.
      - name: build the app's units
        id: build
        run: cmake --build build --parallel 1 --target mux_app -- -k 0
      # What this build was built from: only where it went through, so
      # that what failed is built again from scratch by the next run.
      - name: what the build was built from
        if: steps.build.outcome == 'success'
        run: git ls-files -z | xargs -0 sha1sum > build/sources.sha1
      - name: no list where the build failed
        if: always() && steps.build.outcome != 'success'
        run: rm -f build/sources.sha1
      # Handed to the next stages of this run, where it went through.
      - name: hand the build on
        if: success()
        uses: ./.github/actions/stage-give
        with:
          name: build-clang${{ matrix.llvm }}-app
          dir: build
      # Where it failed, kept for the next run to go on from: the cache holds
      # only this and each run's last stage, not a build per stage.
      - name: keep the build where it failed
        if: always() && (steps.build.outcome == 'failure' || steps.build.outcome == 'cancelled')
        uses: actions/cache/save@v4
        with:
          path: |
            build
            .cache/cpm
          key: build-${{ runner.os }}-clang${{ matrix.llvm }}-${{ env.COMPILER_BUILD }}-${{ env.STAGE }}-app

  # The program's module and its first units, one at a time.
  program:
    needs: app
    name: program (clang ${{ matrix.llvm }})
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        llvm: [23]
    steps:
      # The whole history, as the first run of this workflow checked out.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/desktop-setup
        with:
          llvm: ${{ matrix.llvm }}
      - name: the build the stage before left
        uses: ./.github/actions/stage-take
        with:
          name: build-clang${{ matrix.llvm }}-app
      # The file times the first stage gave: what changed since the run
      # before, at the time this run began; the rest, old.
      - name: file times as the first stage gave them
        run: |
          git ls-files -z | xargs -0 touch -d "@1000000000"
          tr '\n' '\0' < build/changed-sources | xargs -0 -r touch -d "@$(cat build/run-began)"
      # Every unit that fails, not only the first: a run shows them all.
      - name: build the program's first units
        id: build
        run: cmake --build build --parallel 1 --target CMakeFiles/mux.dir/src/app/program.cc.o CMakeFiles/mux.dir/src/main.cc.o CMakeFiles/mux.dir/src/app/program_core.cc.o CMakeFiles/mux.dir/src/app/program_lifetime.cc.o CMakeFiles/mux.dir/src/app/program_media.cc.o -- -k 0
      # What this build was built from: only where it went through, so
      # that what failed is built again from scratch by the next run.
      - name: what the build was built from
        if: steps.build.outcome == 'success'
        run: git ls-files -z | xargs -0 sha1sum > build/sources.sha1
      - name: no list where the build failed
        if: always() && steps.build.outcome != 'success'
        run: rm -f build/sources.sha1
      # Handed to the next stages of this run, where it went through.
      - name: hand the build on
        if: success()
        uses: ./.github/actions/stage-give
        with:
          name: build-clang${{ matrix.llvm }}-program
          dir: build
      # Where it failed, kept for the next run to go on from: the cache holds
      # only this and each run's last stage, not a build per stage.
      - name: keep the build where it failed
        if: always() && (steps.build.outcome == 'failure' || steps.build.outcome == 'cancelled')
        uses: actions/cache/save@v4
        with:
          path: |
            build
            .cache/cpm
          key: build-${{ runner.os }}-clang${{ matrix.llvm }}-${{ env.COMPILER_BUILD }}-${{ env.STAGE }}-program

  # The program's other units, and mux linked; kept for the next run.
  link:
    needs: program
    name: link (clang ${{ matrix.llvm }})
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        llvm: [23]
    steps:
      # The whole history, as the first run of this workflow checked out.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/desktop-setup
        with:
          llvm: ${{ matrix.llvm }}
      - name: the build the stage before left
        uses: ./.github/actions/stage-take
        with:
          name: build-clang${{ matrix.llvm }}-program
      # The file times the first stage gave: what changed since the run
      # before, at the time this run began; the rest, old.
      - name: file times as the first stage gave them
        run: |
          git ls-files -z | xargs -0 touch -d "@1000000000"
          tr '\n' '\0' < build/changed-sources | xargs -0 -r touch -d "@$(cat build/run-began)"
      # Every unit that fails, not only the first: a run shows them all.
      - name: build and link mux
        id: build
        run: cmake --build build --parallel 1 --target mux -- -k 0
      - name: Package binaries with and without debug info
        run: |
          python3 test/binary_artifacts_test.py
          python3 tools/split_binary.py --binary build/mux --output build/binaries --strip llvm-strip-23
          for variant in debug stripped; do
            tar -C "build/binaries/$variant" -caf "build/mux-linux-x86_64-$variant-${GITHUB_SHA}.tar.zst" mux
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mux-linux-x86_64-clang${{ matrix.llvm }}-debug-${{ github.sha }}
          path: build/mux-linux-x86_64-debug-*.tar.zst
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: mux-linux-x86_64-clang${{ matrix.llvm }}-stripped-${{ github.sha }}
          path: build/mux-linux-x86_64-stripped-*.tar.zst
          if-no-files-found: error
      # What this build was built from: only where it went through, so
      # that what failed is built again from scratch by the next run.
      - name: what the build was built from
        if: steps.build.outcome == 'success'
        run: git ls-files -z | xargs -0 sha1sum > build/sources.sha1
      - name: no list where the build failed
        if: always() && steps.build.outcome != 'success'
        run: rm -f build/sources.sha1
      - name: keep the build
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            build
            .cache/cpm
          key: build-${{ runner.os }}-clang${{ matrix.llvm }}-${{ env.COMPILER_BUILD }}-${{ github.sha }}

  # The terminal client.
  cli:
    needs: app
    name: cli (clang ${{ matrix.llvm }})
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        llvm: [23]
    steps:
      # The whole history, as the first run of this workflow checked out.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/desktop-setup
        with:
          llvm: ${{ matrix.llvm }}
      - name: the build the stage before left
        uses: ./.github/actions/stage-take
        with:
          name: build-clang${{ matrix.llvm }}-app
      # The file times the first stage gave: what changed since the run
      # before, at the time this run began; the rest, old.
      - name: file times as the first stage gave them
        run: |
          git ls-files -z | xargs -0 touch -d "@1000000000"
          tr '\n' '\0' < build/changed-sources | xargs -0 -r touch -d "@$(cat build/run-began)"
      # Every unit that fails, not only the first: a run shows them all.
      - name: build the terminal client
        id: build
        run: cmake --build build --parallel 1 --target mux-cli -- -k 0

  # Each test, built and run: a job each.
  test:
    needs: [modules, app]
    name: test (clang ${{ matrix.llvm }}, ${{ matrix.test.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        llvm: [23]
        test: ${{ fromJSON(needs.modules.outputs.tests) }}
    steps:
      # The whole history, as the first run of this workflow checked out.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/desktop-setup
        with:
          llvm: ${{ matrix.llvm }}
      - name: the build the stage before left
        uses: ./.github/actions/stage-take
        with:
          name: build-clang${{ matrix.llvm }}-app
      # The file times the first stage gave: what changed since the run
      # before, at the time this run began; the rest, old.
      - name: file times as the first stage gave them
        run: |
          git ls-files -z | xargs -0 touch -d "@1000000000"
          tr '\n' '\0' < build/changed-sources | xargs -0 -r touch -d "@$(cat build/run-began)"
      - name: build ${{ matrix.test.name }}
        id: build
        if: matrix.test.target != ''
        run: cmake --build build --parallel 1 --target ${{ matrix.test.target }} -- -k 0
      - name: test ${{ matrix.test.name }}
        run: ctest --test-dir build --output-on-failure -R "^${{ matrix.test.name }}$"

  # The stages' builds, and older runs': the last one kept supersedes them --
  # dropped once every job that builds on them is done.
  tidy:
    needs: [link, cli, test]
    if: always()
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        llvm: [23]
    steps:
      - uses: actions/checkout@v4
      - name: drop the builds the last one kept supersedes
        env:
          GH_TOKEN: ${{ github.token }}
        # The key the link saved has the compiler's digest in it, which only
        # the jobs that set the compiler up know: found by this run's commit.
        # Given without it, the key was never found and nothing was dropped --
        # the builds piled up past the repository's 10 GB, and GitHub evicted
        # the newest desktop build with the rest.
        run: |
          prefix="build-${{ runner.os }}-clang${{ matrix.llvm }}-"
          keep=$(gh cache list --repo "$GITHUB_REPOSITORY" --key "$prefix" --limit 100 --json key --jq '.[].key' | grep -e "-${{ github.sha }}\$" | head -n 1 || true)
          if [ -n "$keep" ]; then sh tools/prune_caches.sh "$prefix" "$keep"; else echo "this run saved no build: nothing dropped"; fi
